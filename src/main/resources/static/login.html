<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | DevTracker</title>

<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/animation.css">
<link rel="stylesheet" href="/css/loading.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

<div class="auth-container">

    <!-- ============================================================
         ILLUSTRATED BACKGROUND
         ============================================================ -->

    <svg class="auth-bg-svg"
         viewBox="0 0 1000 750"
         preserveAspectRatio="xMidYMid slice"
         aria-hidden="true">

        <defs>

            <filter id="cornerBlobBlurLogin"
                    x="-50%"
                    y="-50%"
                    width="200%"
                    height="200%">

                <feGaussianBlur stdDeviation="55" />

            </filter>

        </defs>


        <!-- Corner blobs -->

        <circle class="corner-blob corner-blob-orange"
                cx="20"
                cy="20"
                r="150"
                fill="#b8741f"
                opacity="0.16"
                filter="url(#cornerBlobBlurLogin)" />

        <circle class="corner-blob corner-blob-blue"
                cx="985"
                cy="40"
                r="180"
                fill="#5b8fc7"
                opacity="0.14"
                filter="url(#cornerBlobBlurLogin)" />

        <circle class="corner-blob corner-blob-blue"
                cx="15"
                cy="730"
                r="170"
                fill="#5b8fc7"
                opacity="0.13"
                filter="url(#cornerBlobBlurLogin)" />

        <circle class="corner-blob corner-blob-orange"
                cx="990"
                cy="720"
                r="190"
                fill="#b8741f"
                opacity="0.17"
                filter="url(#cornerBlobBlurLogin)" />


        <!-- Paths -->

        <path class="bp-orange"
              d="M 374 307 C 249 198 326 174 356 174 S 411 106 479 195" />

        <path class="bp-blue"
              d="M 581 229 C 615 173 641 141 680 148 S 714 163 712 160" />

        <path class="bp-blue"
              d="M 386 371 C 271 376 313 489 348 511 S 312 621 501 602" />

        <path class="bp-orange"
              d="M 501 602 C 614 553 714 636 667 531 S 819 357 607 351" />

        <path class="bp-orange"
              d="M 607 351 C 621 278 648 308 648 270 S 622 227 581 232" />

        <path class="bp-orange"
              d="M 386 371 C 341 350 339 329 354 335 S 325 293 374 307" />

        <path class="bp-orange"
              d="M 479 195 C 464 159 501 116 535 181 S 567 157 580 229" />


        <!-- Nodes -->

        <circle class="pn" cx="362" cy="173" r="4" />
        <circle class="pn" cx="326" cy="257" r="4" />
        <circle class="pn pn-pulse" cx="637" cy="157" r="4" />
        <circle class="pn-blue pn" cx="700" cy="368" r="4" />
        <circle class="pn-blue pn" cx="677" cy="560" r="4" />
        <circle class="pn-green pn" cx="505" cy="600" r="4" />
        <circle class="pn" cx="462" cy="176" r="4" />
        <circle class="pn" cx="350" cy="511" r="4" />


        <!-- Book -->

        <circle class="badge-ring badge-ring-orange badge-anim-1"
                cx="300"
                cy="220"
                r="15" />

        <text class="badge-icon badge-icon-orange badge-anim-1"
              x="300"
              y="220">📖</text>


        <!-- Trophy -->

        <circle class="badge-ring badge-ring-blue badge-anim-2"
                cx="710"
                cy="160"
                r="15" />

        <text class="badge-icon badge-icon-blue badge-anim-2"
              x="710"
              y="160">🏆</text>


        <!-- Check -->

        <circle class="badge-ring badge-ring-orange badge-anim-3"
                cx="315"
                cy="460"
                r="15" />

        <text class="badge-icon badge-icon-accent badge-anim-3"
              x="315"
              y="460">✔️</text>


        <!-- Rocket -->

        <circle class="badge-ring badge-ring-orange badge-anim-4"
                cx="670"
                cy="444"
                r="15" />

        <text class="badge-icon badge-icon-accent badge-anim-4"
              x="670"
              y="444">🚀</text>

    </svg>


    <!-- ============================================================
         LOGIN CARD
         ============================================================ -->

    <div class="auth-card">

        <div class="auth-brand">

            <div class="auth-brand-mark">🚀</div>

            <div>

                <div class="auth-brand-name">
                    DevTracker
                </div>

                <div class="auth-brand-sub">
                    Learning OS
                </div>

            </div>

        </div>


        <h2>Welcome back</h2>

        <p class="auth-subtitle">
            Continue your learning journey where you left off.
        </p>


        <!-- API error -->

        <div id="authError"
             class="auth-error"
             style="display: none;">

            <i class="ti ti-alert-circle"></i>

            <span id="authErrorText"></span>

        </div>


        <!-- Login form -->

        <form id="loginForm"
              onsubmit="handleLoginSubmit(event)">


            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        <i class="ti ti-mail"></i>
                    </span>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

                </div>

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        <i class="ti ti-lock"></i>
                    </span>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">

                        <i class="ti ti-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Remember / Forgot password -->

            <div class="auth-row">

                <label class="remember-me">

                    <input
                        type="checkbox"
                        name="remember"
                        id="remember">

                    Remember me

                </label>

                <a class="forgot-link"
                   href="#">

                    Forgot password?

                </a>

            </div>


            <!-- Login -->

            <button
                class="btn primary-btn"
                type="submit"
                id="loginBtn">

                <span class="spinner"></span>

                <span class="btn-label">
                    Log in
                </span>

            </button>

        </form>


        <div class="auth-divider">
            or continue with
        </div>


        <!-- Google -->

        <div class="oauth-row">

            <button
                type="button"
                class="oauth-btn"
                onclick="oauthLogin('google')">

                <i class="ti ti-brand-google"></i>

                Google

            </button>

        </div>


        <p class="auth-link">

            New here?

            <a href="register.html">
                Create account
            </a>

        </p>

    </div>

</div>


<script>

function togglePassword(id, btn) {

    const input =
        document.getElementById(id);

    const icon =
        btn.querySelector('i');

    const isHidden =
        input.type === 'password';

    input.type =
        isHidden ? 'text' : 'password';

    icon.className =
        isHidden
            ? 'ti ti-eye-off'
            : 'ti ti-eye';

    btn.setAttribute(
        'aria-label',
        isHidden
            ? 'Hide password'
            : 'Show password'
    );
}


function showAuthError(message) {

    const box =
        document.getElementById('authError');

    const text =
        document.getElementById('authErrorText');

    text.textContent = message;

    box.style.display = 'flex';

    box.classList.add('show');
}


function hideAuthError() {

    const box =
        document.getElementById('authError');

    box.style.display = 'none';

    box.classList.remove('show');
}


async function handleLoginSubmit(event) {

    event.preventDefault();

    hideAuthError();

    const btn =
        document.getElementById('loginBtn');

    btn.classList.add('loading');


    const email =
        document.getElementById('email')
            .value
            .trim();

    const password =
        document.getElementById('password')
            .value;

    const remember =
        document.getElementById('remember')
            .checked;


    try {

        const response =
            await fetch('/api/auth/login', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    email: email,
                    password: password,
                    remember: remember
                })

            });


        const data =
            await response.json();


        if (data.success) {

            /*
             * Dashboard will be migrated later.
             *
             * For now, this will be
             * changed after session handling
             * is implemented.
             */

            window.location.href =
                '/dashboard.html';

        } else {

            showAuthError(
                data.message ||
                'Login failed. Please check your credentials.'
            );

            btn.classList.remove('loading');

        }


    } catch (error) {

        console.error(
            'Login error:',
            error
        );

        showAuthError(
            'Unable to connect to the server. Please try again.'
        );

        btn.classList.remove('loading');

    }

}


function oauthLogin(provider) {
    if (provider === "google") {
        window.location.href = "/google-login";
    }
}


/* Loading component */

window.addEventListener(
    'DOMContentLoaded',
    async () => {

        try {

            const response =
                await fetch('/includes/loading.html');

            if (!response.ok)
                return;

            const html =
                await response.text();

            document
                .getElementById('loadingContainer')
                .innerHTML = html;

        } catch (error) {

            console.error(
                'Unable to load loading component:',
                error
            );

        }

    }
);
async function checkExistingSession() {

    try {

        const response =
            await fetch('/api/auth/session');

        const data =
            await response.json();

        if (data.authenticated) {

            window.location.href =
                '/dashboard.html';
        }

    } catch (error) {

        console.error(
            'Session check failed:',
            error
        );
    }
}

window.addEventListener(
    'DOMContentLoaded',
    checkExistingSession
);

</script>


<!-- Loader -->

<div id="loadingContainer"></div>

<script src="/js/loading.js"></script>

</body>

</html>
